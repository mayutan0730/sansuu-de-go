<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>えりぽん NEWS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <body>

    <!-- えりぽん情報局 -->
    <header class="erina-header">

        <div class="erina-header-inner">

    <div class="erina-title-area">

        <h1>えりぽん情報局</h1>

        <p>ERINA IKUTA NEWS &amp; INFO</p>

    </div>

</div>

    </header>

    <!-- 猿 -->
    <div class="monkey">
        <img src="https://illust8.com/wp-content/uploads/2019/04/eto_monkey_saru_illust_3776.png" alt="さる">
    </div>


    <!-- ==================== -->
    <!-- NEWS -->
    <!-- ==================== -->

    <section class="news">

        <h2>NEWS</h2>

        <div class="news-box" id="news-list">
            <!-- JavaScriptでニュースを表示 -->
        </div>

    </section>


    <!-- ==================== -->
    <!-- イベントのお知らせ -->
    <!-- ==================== -->

    <section class="events">

        <h2>イベントのお知らせ</h2>

        <div class="event-box" id="event-list">
            <!-- JavaScriptでイベントを表示 -->
        </div>

    </section>

    <section class="live">
    <h2>生配信のお知らせ</h2>

    <div class="live-box" id="live-list">
        <!-- JavaScriptで生配信を表示 -->
    </div>
</section>


    <!-- ==================== -->
    <!-- MEDIA -->
    <!-- ==================== -->

    <section class="media">

        <h2>MEDIA</h2>


        <!-- YouTube -->
        <div class="media-category">

            <h3>YouTube</h3>

            <div id="youtube-list">
                <!-- JavaScriptで表示 -->
            </div>

        </div>


        <!-- FC配信 -->
        <div class="media-category">

            <h3>FC配信</h3>

            <div id="fc-list">
                <!-- JavaScriptで表示 -->
            </div>

        </div>


        <!-- TVer -->
        <div class="media-category">

            <h3>TVer</h3>

            <div id="tver-list">
                <!-- JavaScriptで表示 -->
            </div>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>

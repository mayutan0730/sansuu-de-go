<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>算数でGO！</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- タイトル画面 -->
        <div id="title-screen">

            <h1>🧮 算数でGO！</h1>

            <button onclick="showDifficulty()" class="start-button">
                ▶ ゲーム開始
            </button>

        </div>


        <!-- 難易度選択画面 -->
        <div id="difficulty-screen" class="hidden">

            <h2>難易度を選んでね！</h2>

            <button onclick="selectDifficulty('easy')">
                🌱 かんたん
            </button>

            <button onclick="selectDifficulty('normal')">
                🔥 ふつう
            </button>

            <button onclick="selectDifficulty('hard')">
                💀 むずかしい
            </button>

        </div>


        <!-- スコア・コンボ・ライフ -->
        <div class="status hidden">

            <div>⭐ SCORE <span id="score">0</span></div>

            <div>🔥 COMBO <span id="combo">0</span></div>

            <div>❤️ <span id="life">3</span></div>

        </div>


        <!-- タイマー -->
        <div class="timer hidden">
            ⏱️ <span id="timer">30</span>
        </div>


        <!-- ゲーム画面 -->
        <div id="game-screen" class="hidden">

            <p id="message">
                正しい答えを選ぼう！
            </p>

            <div class="question-box">

                <div id="question">
                    12 × 7 = ?
                </div>

            </div>


            <div id="answers" class="answers">

                <button onclick="answerQuestion(0)">84</button>

                <button onclick="answerQuestion(1)">72</button>

                <button onclick="answerQuestion(2)">96</button>

                <button onclick="answerQuestion(3)">78</button>

            </div>

        </div>


        <!-- ゲームオーバー -->
        <div id="game-over" class="hidden">

            <h2>GAME OVER</h2>

            <p>🎉 おつかれさま！</p>

            <p>
                SCORE<br>
                <strong id="final-score">0</strong>
            </p>

            <p>
                BEST COMBO<br>
                <strong id="final-combo">0</strong>
            </p>

            <button onclick="backToDifficulty()" class="restart">
                🔄 もう一回！
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
